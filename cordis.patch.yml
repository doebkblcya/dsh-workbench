# dsh-workbench bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (workspace-gated fs + unified git services, /workbench/*
# and /git/* routes), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client", served at /plugins/ui-dsh-workbench/client.js)
# load in the web GUI.
#
# NOTE: `name` MUST match the actual package name (including the scope) —
# the loader resolves it via `import(name)` from the profile dir. It was
# `dsh-workbench` (no scope) after the rename to @doebkblcya/dsh-workbench,
# which made every `dsh web` boot fail with ERR_MODULE_NOT_FOUND
# ("Cannot find package 'dsh-workbench'"). Fixed 2026-08-15.
- insert:
    - id: ui-dsh-workbench
      name: '@doebkblcya/dsh-workbench'
